# Nginx server block for the Preferans multiplayer server.
# Replace pref.example.com with the real domain, put this file in
# /etc/nginx/sites-available/, symlink into sites-enabled, then run
# certbot --nginx -d pref.example.com (it will add the ssl_* lines),
# and reload nginx.
#
# The landing page at / is a static file: copy deploy/www/index.html to
# /var/www/preferansmaster/index.html (nginx can't read the home dir).

server {
    listen 80;
    server_name pref.example.com;

    # AdMob verification.
    location = /app-ads.txt {
        default_type text/plain;
        return 200 "google.com, pub-8574702904555838, DIRECT, f08c47fec0942fa0\n";
    }

    # Landing page (Google Play lists this domain as the developer website).
    # Exact match only: every other path still goes to the server.
    location = / {
        root /var/www/preferansmaster;
        try_files /index.html =404;
    }

    # Proxy all HTTP traffic (health, privacy, support, etc.)
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8090;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keep idle game connections alive (heartbeat pings every 30s,
        # but be generous so games never drop under proxy timeouts)
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
