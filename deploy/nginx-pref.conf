# Nginx server block for the Preferans multiplayer server.
# Replace pref.example.com with the real domain, put this file in
# /etc/nginx/sites-available/, symlink into sites-enabled, then run
# certbot --nginx -d pref.example.com (it will add the ssl_* lines),
# and reload nginx.

server {
    listen 80;
    server_name pref.example.com;

    location /health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8090;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # keep idle game connections alive (heartbeat pings every 30s,
        # but be generous so games never drop under proxy timeouts)
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
